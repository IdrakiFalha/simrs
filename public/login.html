<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — RSUD Meuraxa SIMRS</title>
    <meta name="description" content="Portal login SIMRS RSUD Meuraxa terintegrasi SATUSEHAT FHIR R4">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00c9a7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <script>
        (function initTheme() {
            const saved = localStorage.getItem('simrs_theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body class="login-body">

    <div class="login-card" id="loginCard">
        <div class="text-center mb-4">
            <div class="login-logo"><i class="bi bi-hospital"></i></div>
            <h1 class="h3 fw-bold mb-2">RSUD MEURAXA</h1>
            <p class="text-secondary mb-0" style="font-size:1rem; font-weight:600;">Sistem Informasi Manajemen</p>
        </div>

        <!-- Alert area (injected by JS) -->
        <div id="loginAlert" class="d-none"></div>

        <form id="formLogin" autocomplete="off" novalidate>
            <div class="mb-4">
                <label class="form-label fw-bold" for="username">Nama Pengguna (Username)</label>
                <input class="form-control form-control-lg" id="username" name="username" required autofocus placeholder="Ketik username Anda...">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold" for="password">Kata Sandi (Password)</label>
                <div class="input-group input-group-lg">
                    <input class="form-control" type="password" id="password" name="password" required placeholder="••••••••">
                    <button class="btn btn-outline-secondary" type="button" id="togglePass" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <button class="btn btn-accent btn-lg w-100 mb-4 fw-bold" type="submit" id="btnLogin" style="padding: 1rem;">
                <span id="btnLoginText">MASUK APLIKASI</span>
            </button>
        </form>

        <div class="login-hints mb-4 d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary hint" data-user="admin">Demo Admin</button>
            <button type="button" class="btn btn-sm btn-outline-secondary hint" data-user="dokter1">Demo Dokter</button>
        </div>

        <div class="text-center mt-3 pt-4 border-top border-secondary border-opacity-25">
            <p class="mb-0">
                <a href="../index.php?r=auth/register" class="text-accent fw-bold" style="font-size: 1.05rem;">
                    Daftar Akun Baru
                </a>
            </p>
        </div>
    </div>

    <!-- Toast host -->
    <div id="toastHost" class="toast-host"></div>

    <script src="js/app.js"></script>
    <script src="js/sync.js"></script>
    <script>
    /**
     * Login Page Logic
     * Calls POST /api/auth/login, handles response, redirects to dashboard.html
     */
    (function () {
        'use strict';

        const form    = document.getElementById('formLogin');
        const alertEl = document.getElementById('loginAlert');
        const btnText = document.getElementById('btnLoginText');
        const btn     = document.getElementById('btnLogin');

        // ── Toggle password visibility ────────────────────────────────────────
        document.getElementById('togglePass').addEventListener('click', function () {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
            this.querySelector('i').className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
        });

        // ── Demo account hints ────────────────────────────────────────────────
        document.querySelectorAll('.login-hints .hint').forEach(el => {
            el.addEventListener('click', () => {
                document.getElementById('username').value = el.dataset.user;
                document.getElementById('password').value = 'rahasia123';
                document.getElementById('password').focus();
            });
        });

        // ── Show inline alert ──────────────────────────────────────────────────
        function showAlert(msg, type = 'danger') {
            alertEl.className = `alert-simrs ${type} mb-3`;
            alertEl.textContent = msg;
        }

        // ── Login submit ───────────────────────────────────────────────────────
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showAlert('Username dan password wajib diisi.');
                return;
            }

            // Loading state
            btn.disabled   = true;
            btnText.textContent = 'Memverifikasi…';

            try {
                // ── Offline Emergency Login ─────────────────────────────────────
                if (!navigator.onLine) {
                    App.setCsrf('offline-dummy-token');
                    App.setUser({
                        id: 999,
                        username: username,
                        nama_lengkap: 'Sesi Darurat Offline',
                        role: 'admin'
                    });
                    App.toast('Sesi Darurat Offline Aktif!', 'warn');
                    showAlert('<i class="bi bi-wifi-off me-1"></i>Login darurat tanpa koneksi berhasil.', 'warning');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
                    return;
                }

                // 1. Fetch fresh CSRF token
                const csrfRes = await fetch(SIMRS_API('/csrf-token'), { credentials: 'include' });
                const csrfData = await csrfRes.json();
                App.setCsrf(csrfData.token);

                // 2. POST login credentials
                const res  = await App.apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();

                if (res.ok && data.ok) {
                    // Store csrf from login response (fresh for new session)
                    App.setCsrf(data.csrf_token);
                    App.setUser(data.user);
                    App.toast('Login berhasil! Mengalihkan…', 'success');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);
                } else {
                    showAlert(data.message || 'Username atau password salah.');
                    btn.disabled  = false;
                    btnText.textContent = 'Masuk Portal';
                }

            } catch (err) {
                showAlert('Tidak dapat terhubung ke server. Periksa koneksi Anda.');
                btn.disabled  = false;
                btnText.textContent = 'Masuk Portal';
            }
        });

        // ── Auto-redirect if already logged in ────────────────────────────────
        (async function checkSession() {
            try {
                const res  = await fetch(SIMRS_API('/auth/me'), { credentials: 'include' });
                const data = await res.json();
                if (data.ok && data.user) {
                    window.location.replace('dashboard.html');
                }
            } catch (_) { /* offline or not logged in — show login page */ }
        })();

    })();
    </script>
</body>
</html>
